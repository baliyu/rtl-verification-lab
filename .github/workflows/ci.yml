name: CI

# Runs on every push to main, on pull requests, and on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Simulate in Verilog and VHDL, and break the circuits on purpose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the simulators (Icarus Verilog and GHDL)
        run: bash tools/setup_ubuntu.sh --system-only

      - name: Install cocotb and pytest
        run: python -m pip install -r requirements.txt

      - name: Run every block in both languages at both bit rates
        run: python -m pytest -q

      - name: Break the circuits on purpose (every bug must be caught, except the one that cannot be)
        run: python tools/mutate.py

      - name: The recorded mutation results must be what this run produced
        run: git diff --exit-code -- results/mutation.json
